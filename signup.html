<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ConstructEx</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 antialiased min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-black text-gray-900 tracking-tighter">Construct<span class="text-[#7C3AED]">Ex</span></a>
            <div class="hidden md:flex items-center gap-8 font-medium text-gray-600">
                <a href="index.html" class="hover:text-[#7C3AED] transition-colors">Home</a>
                <a href="about.html" class="hover:text-[#7C3AED] transition-colors">About</a>
                <a href="contact.html" class="hover:text-[#7C3AED] transition-colors">Contact</a>
                <a href="signin.html" class="hover:text-[#7C3AED] transition-colors">Sign In</a>
                <a href="signup.html" class="bg-[#7C3AED] text-white px-6 py-2.5 rounded-full font-bold shadow-lg shadow-[#7C3AED]/30">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Sign Up Section -->
    <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-6">
        <div class="max-w-md w-full bg-white p-10 rounded-[2rem] shadow-xl border border-gray-100">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-black text-gray-900 mb-2">Create Account</h2>
                <p class="text-gray-500 font-medium">Join ConstructEx today</p>
            </div>
            
            <form action="#" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
                    <input type="text" class="w-full px-5 py-4 rounded-xl border border-gray-200 focus:border-[#7C3AED] focus:ring-2 focus:ring-[#7C3AED]/20 outline-none transition-all bg-gray-50" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
                    <input type="email" class="w-full px-5 py-4 rounded-xl border border-gray-200 focus:border-[#7C3AED] focus:ring-2 focus:ring-[#7C3AED]/20 outline-none transition-all bg-gray-50" placeholder="john@example.com">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <input type="password" class="w-full px-5 py-4 rounded-xl border border-gray-200 focus:border-[#7C3AED] focus:ring-2 focus:ring-[#7C3AED]/20 outline-none transition-all bg-gray-50" placeholder="••••••••">
                </div>
                <button type="button" class="w-full bg-[#7C3AED] hover:bg-[#6D28D9] text-white font-bold py-4 rounded-xl transition-colors shadow-lg shadow-[#7C3AED]/30">
                    Create Account
                </button>
                
                <p class="text-center text-gray-500 font-medium mt-6">
                    Already have an account? <a href="signin.html" class="text-gray-900 font-bold hover:underline">Sign in</a>
                </p>
            </form>
        </div>
    </main>
</body>
</html>
